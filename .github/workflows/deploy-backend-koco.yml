name: Deploy watermark-koco-api (Portal)

on:
  push:
    branches: [feat/koco-portal]
    paths:
      - 'watermark_backend/**'
      - '.github/workflows/deploy-backend-koco.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./watermark_backend
          file: ./watermark_backend/Dockerfile
          push: true
          tags: |
            oksusu2020/watermark-koco-api:latest
            oksusu2020/watermark-koco-api:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 마이그레이션 + 컨테이너 배포
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.WATERMARK_KOCO_DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.WATERMARK_KOCO_MIGRATE_DATABASE_URL }}
          PORTAL_PUBLIC_KEY: ${{ secrets.PORTAL_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DATABASE_URL,MIGRATE_DATABASE_URL,PORTAL_PUBLIC_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,INTERNAL_API_SECRET
          script: |
            set -e
            # 1) 최신 이미지 받기
            docker pull oksusu2020/watermark-koco-api:latest

            # 2) 마이그레이션(watermark_migrate 권한, 일회성 컨테이너)
            docker run --rm \
              -e DATABASE_URL="$MIGRATE_DATABASE_URL" \
              -w /app \
              oksusu2020/watermark-koco-api:latest \
              npx prisma migrate deploy

            # 3) uploads 디렉토리(로컬 폴백용)
            mkdir -p ~/watermark-koco-data/uploads/images ~/watermark-koco-data/uploads/logos ~/watermark-koco-data/uploads/processed

            # 4) 서비스 컨테이너 교체(watermark_app 권한, 포트 3802)
            docker stop watermark-koco-api 2>/dev/null || true
            docker rm watermark-koco-api 2>/dev/null || true
            docker run -d \
              --name watermark-koco-api \
              --restart unless-stopped \
              -p 3802:4000 \
              -v ~/watermark-koco-data/uploads:/app/uploads \
              -e NODE_ENV=production \
              -e PORT=4000 \
              -e "DATABASE_URL=${DATABASE_URL}" \
              -e FRONTEND_URL=https://watermark.koco.me \
              -e "PORTAL_PUBLIC_KEY=${PORTAL_PUBLIC_KEY}" \
              -e USE_S3=true \
              -e "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" \
              -e "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" \
              -e "AWS_S3_BUCKET=${AWS_S3_BUCKET}" \
              -e AWS_REGION=ap-northeast-2 \
              -e MAX_FILE_SIZE=10485760 \
              -e PORTAL_INTERNAL_API_URL=https://api.koco.me \
              -e "INTERNAL_API_SECRET=${INTERNAL_API_SECRET}" \
              oksusu2020/watermark-koco-api:latest
            docker image prune -f

            # 5) 헬스 체크
            sleep 5
            docker ps | grep watermark-koco-api
            curl -s http://localhost:3802/health || echo "Health check pending..."
