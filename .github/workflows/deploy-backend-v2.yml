name: Build and Deploy Backend V2 (Staging)

on:
  push:
    branches:
      - v2
    paths:
      - 'watermark_backend/**'
      - '.github/workflows/deploy-backend-v2.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: watermark-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: v2-${{ github.sha }}
        run: |
          cd watermark_backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:v2-latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:v2-latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: Deploy V2 to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_V2 }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL_V2 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          SUB_DOMAIN_API_KEY: ${{ secrets.SUB_DOMAIN_API_KEY }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: ECR_REGISTRY,DATABASE_URL,FRONTEND_URL,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,SUB_DOMAIN_API_KEY
          script: |
            # ECR 로그인
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY

            # v2 이미지 pull
            docker pull $ECR_REGISTRY/watermark-api:v2-latest

            # v2 uploads 디렉토리 생성
            mkdir -p ~/watermark-data-v2/uploads/images ~/watermark-data-v2/uploads/logos ~/watermark-data-v2/uploads/processed

            # v2 컨테이너 중지 및 삭제
            docker stop watermark-api-v2 2>/dev/null || true
            docker rm watermark-api-v2 2>/dev/null || true

            # v2 컨테이너 실행 (포트 4001)
            docker run -d \
              --name watermark-api-v2 \
              --restart unless-stopped \
              -p 4001:4000 \
              -e NODE_ENV=production \
              -e PORT=4000 \
              -e "DATABASE_URL=${DATABASE_URL}" \
              -e "FRONTEND_URL=${FRONTEND_URL}" \
              -e "USE_S3=true" \
              -e "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" \
              -e "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" \
              -e "AWS_S3_BUCKET=${AWS_S3_BUCKET}" \
              -e "AWS_REGION=ap-northeast-2" \
              -e "MAX_FILE_SIZE=10485760" \
              -e "SUB_DOMAIN_API_KEY=${SUB_DOMAIN_API_KEY}" \
              $ECR_REGISTRY/watermark-api:v2-latest

            # 상태 확인
            sleep 5
            docker ps | grep watermark-api-v2
            curl -s http://localhost:4001/health || echo "Health check pending..."

      - name: Deployment complete
        run: echo "Backend V2 (staging) deployed successfully!"
